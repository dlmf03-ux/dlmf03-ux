<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Демо — информационный ИИ-ассистент</title>
  <style>
    body{margin:0;background:linear-gradient(135deg,#edf6f1,#d7eadf);font:18px/1.55 system-ui;color:#214237;min-height:100vh;display:grid;place-items:center}
    .card{background:#fff;padding:38px;border-radius:24px;box-shadow:0 24px 70px #21423722;max-width:650px;margin:20px}
    .card h1{margin-top:0;font-size:32px}.card p{color:#52665f}
  </style>
</head>
<body>
  <main class="card">
    <h1>Информационный ассистент</h1>
    <p>Демонстрационная страница для примера RAG-ассистента. Откройте чат в правом верхнем углу и задайте вопрос по синтетической базе знаний.</p>
    <p>Название объекта, контакты, тарифы и описания в примере вымышлены.</p>
  </main>
  <script src="/widget.js" data-api="/api/chat" defer></script>
</body>
</html>
